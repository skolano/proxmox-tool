[project]
name = "proxmox-tools"
dynamic = ["version"]
description = "CLI for querying Proxmox VE clusters through the REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer==0.27.2",
    "requests==2.34.2",
    "rich==15.0.0",
    "questionary==2.1.1",
    "PyYAML==6.0.3",
]

[project.scripts]
proxmox-tool = "proxmox_tools.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "proxmox_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
